    <style>
        .carousel-item img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            /* cobre toda a tela */
        }

        /* Texto centralizado e responsivo */
        .inicio {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            text-align: center;
            padding: 0 5%;
           
            /* evita que grude nas bordas em telas pequenas */
        }
        .titulo{
             font-family: BebasNeue;
            font-size: clamp(4rem, 14vw, 8rem) !important;
            line-height: 0.8;
        }
        .arte{
            font-size: clamp(4.5rem, 16vw, 9rem) !important;
            font-family: graffiti;
            color: #fe731d;
        }

        .quebra-texto {
            width: 100%;
        }

        .objetivo {
            width: 100%;
            background-color: #2697d5;
        }

        .divido {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            min-height: 100vh;
            /* ocupa toda a altura da tela */
            margin: 0;
            padding: 0;
        }

        .banner {
            flex: 1 1 50%;
            /* cada div ocupa metade da largura */
            display: flex;
            align-items: center;
            /* centraliza verticalmente */
            justify-content: center;
            /* centraliza horizontalmente */
            box-sizing: border-box;
            /* garante que o padding não aumente a largura */

        }

        .banner img {
            width: 100%;
            height: auto;
            display: block;
            /* já remove espaço embaixo da img */
        }



        .texto {
            color: white;
        }

        .menu {
            padding: 5% 2%;
            margin-top: 50px;
            /* empurra a seção para baixo */
        }

        .menu h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: bold;
            font-family: futura-display;
        }

        /* Botão como container */
        .botoes {
            margin-top: 10%;
            position: relative;
            display: inline-block;
            overflow: hidden;
            text-decoration: none;
            color: white;
            font-weight: bold;
            text-align: center;
        }

        /* Imagem do botão */
        .botoes img {
            width: clamp(80px, 12vw, 140px);
            /* responsivo */
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Texto dentro da imagem */
        .botoes .label {
            position: absolute;
            bottom: 30%;
            /* sobe um pouco do rodapé da imagem */
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            padding: 4px 8px;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* Efeito hover */
        .botoes:hover {
            border-radius: 8px;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }


        .quebra-texto img,
        .objetivo img {
            width: 100%;
            height: auto;
            /* mantém a proporção */
            display: block;
            /* remove espaços embaixo da imagem */
        }

        .guia {
            background-image: url('img/Baner-pisca---favelas.gif');
            background-size: cover;
            /* mantém a imagem inteira */
            background-position: top center;
            /* alinha ao topo */
            background-repeat: no-repeat;
            width: 100%;
            min-height: 400px;
            /* ajuste conforme precisar */
        }


        /* Responsivo: em telas menores, fica um embaixo do outro */
        @media (max-width: 768px) {

            .banner,
            .texto {
                flex: 1 1 100%;
                /* cada um ocupa 100% */
            }

            .botoes-container {
                margin-top: 30px;
            }

            .guia {
                min-height: 50px;
            }

        }
    </style>
</head>
